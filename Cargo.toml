[package]
name = "continuum-clay-variation"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Continuum Clay Variation: 81-Mode Shell Model, NTT-81 Prism, Omega/Omnibit Room Invariant & Real-Norm Scaling"
authors = ["Jesse Daniel Brown <JesseBrown1980>", "Rayssa Chiqueto"]
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

